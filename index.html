<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 LCS SUMMER 협곡대회 — 선수 정보 시트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e16;
    --bg-2:#0d1220;
    --panel:#131a28;
    --panel-2:#1b2436;
    --line: rgba(200,170,110,0.22);
    --gold:#c8aa6e;
    --gold-bright:#f0c766;
    --parchment:#f5ecd9;
    --muted:#aab4c8;
    --void:#8b5cf6;
    --piltover:#e8a93b;
    --zaun:#3ecf6e;
    --radius:10px;
    --t-unranked:#5a6376;
    --t-gold:#d8a13c;
    --t-platinum:#3fc7b8;
    --t-emerald:#2fae6e;
    --t-diamond:#5b8def;
    --t-master:#b565e8;
    --t-gm:#e0554f;
    --t-challenger:#f0c766;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(ellipse at top, rgba(200,170,110,0.07), transparent 60%), var(--bg);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  header.top{
    padding:26px 20px 16px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(200,170,110,0.06), transparent);
  }
  header.top h1{
    font-family:'Orbitron',sans-serif; font-weight:800; font-size:22px; letter-spacing:0.5px;
    margin:0 0 6px; color:var(--gold-bright);
  }
  header.top p{margin:0; color:var(--muted); font-size:13px;}

  main{max-width:1180px; margin:0 auto; padding:20px;}

  .stat-row{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .stat-chip{
    background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:8px 16px;
    font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px;
  }
  .stat-chip b{color:var(--gold-bright); font-family:'JetBrains Mono',monospace; font-size:14px;}

  .tier-legend{
    text-align:center; font-size:11.5px; color:var(--muted); margin-bottom:16px; line-height:1.6;
  }
  .tier-legend b{color:var(--gold-bright); font-weight:700;}

  .controls{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:16px; display:flex; flex-direction:column; gap:12px;
  }
  .controls input.search{
    width:100%; padding:11px 14px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-2); color:var(--parchment); font-size:15px;
  }
  .controls input.search::placeholder{color:var(--muted);}
  .chip-row{display:flex; gap:7px; flex-wrap:wrap; align-items:center;}
  .chip-row .label{font-size:11.5px; color:var(--muted); margin-right:2px;}
  .filter-chip{
    padding:6px 13px; border-radius:16px; border:1px solid var(--line); background:var(--bg-2);
    color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer; transition:all .12s ease;
    user-select:none;
  }
  .filter-chip:hover{border-color:var(--gold);}
  .filter-chip.active{background:var(--gold-bright); color:#1a1410; border-color:var(--gold-bright);}
  .filter-chip[data-group="공허"].active{background:var(--void); color:#fff; border-color:var(--void);}
  .filter-chip[data-group="필트오버"].active{background:var(--piltover); color:#1a1410; border-color:var(--piltover);}
  .filter-chip[data-group="자운"].active{background:var(--zaun); color:#08160e; border-color:var(--zaun);}

  .view-toggle{display:flex; gap:6px;}
  .view-toggle button{
    flex:1; padding:9px; border-radius:8px; border:1px solid var(--line); background:var(--bg-2);
    color:var(--muted); font-size:13px; font-weight:700; cursor:pointer; font-family:'Orbitron',sans-serif; letter-spacing:0.3px;
  }
  .view-toggle button.active{background:var(--gold-bright); color:#1a1410; border-color:var(--gold-bright);}

  /* ---- 티어 배지 ---- */
  .tier-badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:6px;
    font-size:12px; font-weight:700; font-family:'JetBrains Mono',monospace; white-space:nowrap;
  }
  .tier-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .tier-unranked{background:rgba(90,99,118,0.18); color:#9aa3b5;}
  .tier-unranked .tier-dot{background:#5a6376;}
  .tier-gold{background:rgba(216,161,60,0.15); color:var(--t-gold);}
  .tier-gold .tier-dot{background:var(--t-gold);}
  .tier-platinum{background:rgba(63,199,184,0.15); color:var(--t-platinum);}
  .tier-platinum .tier-dot{background:var(--t-platinum);}
  .tier-emerald{background:rgba(47,174,110,0.18); color:var(--t-emerald);}
  .tier-emerald .tier-dot{background:var(--t-emerald);}
  .tier-diamond{background:rgba(91,141,239,0.18); color:var(--t-diamond);}
  .tier-diamond .tier-dot{background:var(--t-diamond);}
  .tier-master{background:rgba(181,101,232,0.18); color:var(--t-master);}
  .tier-master .tier-dot{background:var(--t-master);}
  .tier-gm{background:rgba(224,85,79,0.18); color:var(--t-gm);}
  .tier-gm .tier-dot{background:var(--t-gm);}
  .tier-challenger{
    background:linear-gradient(90deg, rgba(240,199,102,0.25), rgba(126,232,224,0.25));
    color:var(--t-challenger); box-shadow:0 0 0 1px rgba(240,199,102,0.4) inset;
  }
  .tier-challenger .tier-dot{background:linear-gradient(90deg,#f0c766,#7ee8e0);}

  /* ---- 팀별 카드 뷰 (기본) ---- */
  .team-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:14px;}
  .team-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px;
  }
  .team-card h3{
    margin:0 0 10px; font-family:'Orbitron',sans-serif; font-size:14px; display:flex; align-items:center; gap:8px;
  }
  .team-card h3 .group-dot{width:9px; height:9px;}
  .p-row{
    display:flex; align-items:flex-start; gap:8px; padding:8px 0; border-top:1px solid rgba(200,170,110,0.08);
  }
  .p-row:first-of-type{border-top:none;}
  .p-row .r{
    width:34px; flex-shrink:0; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--gold-bright);
    padding-top:2px;
  }
  .p-row .info{flex:1; min-width:0;}
  .p-row .name-line{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:3px;}
  .p-row .pname{font-weight:700; font-family:'JetBrains Mono',monospace; font-size:13px;}
  .captain-badge{
    font-size:9.5px; font-weight:800; color:#1a1410; background:var(--gold-bright); padding:1px 6px; border-radius:8px;
    letter-spacing:0.3px; font-family:'Orbitron',sans-serif;
  }
  .p-row .champs{font-size:12px; color:var(--parchment); opacity:0.8; margin-bottom:3px;}
  .p-row .notes{font-size:11px; color:var(--muted); line-height:1.5;}
  .p-row.dim{opacity:0.28;}
  .tier-pair{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:4px;}

  /* ---- 전체 목록(정렬) 뷰 ---- */
  .sheet{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  table{width:100%; border-collapse:collapse;}
  thead th{
    position:sticky; top:0; background:var(--panel-2); color:var(--gold-bright);
    font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:0.5px; text-transform:uppercase;
    padding:12px 10px; text-align:left; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap;
  }
  thead th:hover{color:#fff;}
  thead th.sort-active{color:#fff;}
  thead th .arrow{font-size:9px; opacity:0.6; margin-left:3px;}
  tbody tr{border-bottom:1px solid rgba(200,170,110,0.08);}
  tbody tr:hover{background:rgba(200,170,110,0.05);}
  tbody tr:last-child{border-bottom:none;}
  tbody td{padding:11px 10px; font-size:13px; vertical-align:top;}
  .group-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle;}
  .group-dot.공허{background:var(--void);}
  .group-dot.필트오버{background:var(--piltover);}
  .group-dot.자운{background:var(--zaun);}
  td.team-cell{color:var(--muted); font-size:12.5px;}
  td.role-cell{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--gold-bright); font-weight:700;}
  td.name-cell{font-weight:700; color:var(--parchment); font-family:'JetBrains Mono',monospace; font-size:13px;}
  td.champ-cell{color:var(--parchment); opacity:0.85; font-size:12.5px; max-width:220px;}
  td.notes-cell{color:var(--muted); font-size:11.5px; line-height:1.5; max-width:280px;}
  .empty-msg{padding:40px; text-align:center; color:var(--muted); font-size:13px;}

  @media (max-width:760px){
    main{padding:12px;}
    .team-grid{grid-template-columns:1fr;}
    thead{display:none;}
    table, tbody, tr, td{display:block; width:100%;}
    tbody tr{background:var(--bg-2); border:1px solid var(--line); border-radius:8px; margin-bottom:10px; padding:12px;}
    tbody td{padding:3px 0; font-size:13px;}
    td.notes-cell, td.champ-cell{max-width:none;}
    td::before{content: attr(data-label); display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:2px; font-family:'Orbitron',sans-serif;}
    td.name-cell{font-size:15px; padding-top:0;}
    td.name-cell::before{display:none;}
    .controls input.search{font-size:16px;}
  }
</style>
</head>
<body>

<header class="top">
  <h1>2026 LCS SUMMER 협곡대회</h1>
  <p>선수 정보 시트 — 60명 전체 참고용 명단</p>
</header>

<main>
  <div class="stat-row" id="statRow"></div>
  <div class="tier-legend"><b>현재 티어</b>: 이번 시즌 솔로랭크 기준 (언랭인 경우 자유랭크를 괄호로 표시) &nbsp;·&nbsp; <b>최고 티어</b>: 솔로/자유랭크 통틀어 역대 최고 기록</div>

  <div class="controls">
    <div class="view-toggle">
      <button id="viewTeamBtn">팀별 보기</button>

    <div class="chip-row" id="groupChips">
      <span class="label">그룹</span>
    </div>
    <div class="chip-row" id="roleChips">
      <span class="label">라인</span>
    </div>
  </div>

  <div id="teamView" class="team-grid"></div>

  <div id="flatView" class="sheet" style="display:none;">
    <table>
      <thead>
        <tr>
          <th data-sort="group">그룹</th>
          <th data-sort="team">팀</th>
          <th data-sort="roleOrder">라인</th>
          <th data-sort="name">선수</th>
          <th data-sort="tierRank">현재 티어</th>
          <th data-sort="peakRank">최고 티어</th>
          <th>모스트 챔피언</th>
          <th>메모</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty-msg" id="emptyMsg" style="display:none;">조건에 맞는 선수가 없어요.</div>
  </div>
</main>

const GROUPS = ['전체','공허','필트오버','자운'];
const ROLES = [
  {key:'전체', label:'전체'},
  {key:'ADC', label:'원딜(팀장)'},
  {key:'TOP', label:'탑'},
  {key:'JGL', label:'정글'},
  {key:'MID', label:'미드'},
  {key:'SUP', label:'서폿'},
];
const ROLE_ORDER_NUM = {ADC:0, TOP:1, JGL:2, MID:3, SUP:4};
const TIER_RANK = {'':0, '언랭':0, '아이언':1, '브론즈':2, '실버':3, '골드':4, '플래티넘':5, '에메랄드':6, '다이아':7, '마스터':8, '그랜드마스터':9, '챌린저':10};
const TIER_CLASS = {'':'unranked','아이언':'unranked','브론즈':'unranked','실버':'unranked','골드':'gold','플래티넘':'platinum','에메랄드':'emerald','다이아':'diamond','마스터':'master','그랜드마스터':'gm','챌린저':'challenger'};

function baseTier(raw){ return (raw||'').replace(/\(.*?\)/g,'').trim(); }
function tierRank(raw){ return TIER_RANK[baseTier(raw)] ?? 0; }
function tierBadge(raw){
  const base = baseTier(raw);
  if(!base) return '<span class="tier-badge tier-unranked"><span class="tier-dot"></span>언랭</span>';
  const cls = TIER_CLASS[base] || 'unranked';
  const suffix = raw.includes('(') ? raw.slice(raw.indexOf('(')) : '';
  return `<span class="tier-badge tier-${cls}"><span class="tier-dot"></span>${base}${suffix?(' '+suffix):''}</span>`;
}

PLAYERS.forEach(p=>{ p.roleOrder = ROLE_ORDER_NUM[p.role]; p.tierRank = tierRank(p.tier); p.peakRank = tierRank(p.peakTier); });

// 팀 목록 (등장 순서 유지, 팀장=원딜 기준으로 이미 구성되어 있음)
const TEAMS = [];
{
  const seen = new Set();
  PLAYERS.forEach(p=>{
    const key = p.group+'|||'+p.team;
    if(!seen.has(key)){
      seen.add(key);
      TEAMS.push({group:p.group, team:p.team, players: PLAYERS.filter(x=>x.group===p.group && x.team===p.team).sort((a,b)=>a.roleOrder-b.roleOrder)});
    }
  });
}

let state = { group:'전체', role:'전체', sortKey:null, sortDir:1, view:'team' };

function renderStats(){
  const el = document.getElementById('statRow');
  const total = PLAYERS.length;
  const masterUp = PLAYERS.filter(p=>p.peakRank>=8).length;
  const gmUp = PLAYERS.filter(p=>p.peakRank>=9).length;
  el.innerHTML = `
    <div class="stat-chip">전체 <b>${total}</b>명</div>
    <div class="stat-chip">최고 마스터+ <b>${masterUp}</b>명</div>
    <div class="stat-chip">최고 그랜드마스터+ <b>${gmUp}</b>명</div>
  `;
}

function renderChips(){
  const gEl = document.getElementById('groupChips');
  GROUPS.forEach(g=>{
    const b = document.createElement('span');
    b.className = 'filter-chip';
    b.textContent = g;
    b.dataset.group = g;
    b.onclick = ()=>{ state.group = g; renderView(); };
    gEl.appendChild(b);
  });
  const rEl = document.getElementById('roleChips');
  ROLES.forEach(r=>{
    const b = document.createElement('span');
    b.className = 'filter-chip';
    b.textContent = r.label;
    b.dataset.role = r.key;
    b.onclick = ()=>{ state.role = r.key; renderView(); };
    rEl.appendChild(b);
  });
}


document.getElementById('viewTeamBtn').onclick = ()=>{ state.view='team'; renderView(); };
document.getElementById('viewFlatBtn').onclick = ()=>{ state.view='flat'; renderView(); };

document.querySelectorAll('thead th[data-sort]').forEach(th=>{
  th.onclick = ()=>{
    const key = th.dataset.sort;
    if(state.sortKey===key){ state.sortDir *= -1; } else { state.sortKey = key; state.sortDir = (key==='tierRank'||key==='peakRank') ? -1 : 1; }
    renderView();
  };
});

function matchesFilter(p){
  if(state.group!=='전체' && p.group!==state.group) return false;
  return true;
}

function renderTeamView(){
  const el = document.getElementById('teamView');
  const teams = TEAMS.filter(t => state.group==='전체' || t.group===state.group);
  el.innerHTML = teams.map(t=>{
    const rows = t.players.map(p=>{
      const isCaptain = p.role==='ADC';
      const roleMatch = state.role==='전체' || p.role===state.role;
      const visible = roleMatch;
      return `
        <div class="p-row ${visible?'':'dim'}">
          <div class="r">${p.roleLabel}</div>
          <div class="info">
            <div class="name-line">
              <span class="pname">${p.name}</span>
              ${isCaptain?'<span class="captain-badge">팀장</span>':''}
            </div>
            <div class="tier-pair">${tierBadge(p.tier)}${tierBadge(p.peakTier)}</div>
            <div class="champs">${p.champPool}</div>
            <div class="notes">${p.notes}</div>
          </div>
        </div>
      `;
    }).join('');
    return `
      <div class="team-card">
        <h3><span class="group-dot ${t.group}"></span>${t.team}</h3>
        ${rows}
      </div>
    `;
  }).join('');
  if(teams.length===0){
    el.innerHTML = '<div class="empty-msg" style="grid-column:1/-1;">조건에 맞는 팀이 없어요.</div>';
  }
}

function renderFlatView(){
  document.querySelectorAll('thead th[data-sort]').forEach(th=>{
    th.classList.toggle('sort-active', th.dataset.sort===state.sortKey);
    const old = th.querySelector('.arrow'); if(old) old.remove();
    if(th.dataset.sort===state.sortKey){
      const arrow = document.createElement('span');
      arrow.className='arrow';
      arrow.textContent = state.sortDir===1 ? '▲' : '▼';
      th.appendChild(arrow);
    }
  });

  let list = PLAYERS.filter(p=>{
    if(!matchesFilter(p)) return false;
    if(state.role!=='전체' && p.role!==state.role) return false;
    return true;
  });

  if(state.sortKey){
    list.sort((a,b)=>{
      const av=a[state.sortKey], bv=b[state.sortKey];
      if(typeof av==='string') return av.localeCompare(bv,'ko') * state.sortDir;
      return (av-bv) * state.sortDir;
    });
  } else {
    list.sort((a,b)=> a.group.localeCompare(b.group,'ko') || a.team.localeCompare(b.team,'ko') || a.roleOrder-b.roleOrder);
  }

  const tbody = document.getElementById('tbody');
  const emptyMsg = document.getElementById('emptyMsg');
  if(list.length===0){
    tbody.innerHTML = '';
    emptyMsg.style.display='block';
    return;
  }
  emptyMsg.style.display='none';
  tbody.innerHTML = list.map(p=>`
    <tr>
      <td data-label="그룹"><span class="group-dot ${p.group}"></span>${p.group}</td>
      <td class="team-cell" data-label="팀">${p.team}</td>
      <td class="role-cell" data-label="라인">${p.roleLabel}</td>
      <td class="name-cell" data-label="선수">${p.name}</td>
      <td data-label="현재 티어">${tierBadge(p.tier)}</td>
      <td data-label="최고 티어">${tierBadge(p.peakTier)}</td>
      <td class="champ-cell" data-label="모스트 챔피언">${p.champPool}</td>
      <td class="notes-cell" data-label="메모">${p.notes}</td>
    </tr>
  `).join('');
}

function renderView(){
  // 칩/버튼 active 상태 갱신 (재생성 없이 클래스만 토글 — 중복 생성 버그 방지)
  document.querySelectorAll('#groupChips .filter-chip').forEach(b=>b.classList.toggle('active', b.dataset.group===state.group));
  document.querySelectorAll('#roleChips .filter-chip').forEach(b=>b.classList.toggle('active', b.dataset.role===state.role));
  document.getElementById('viewTeamBtn').classList.toggle('active', state.view==='team');
  document.getElementById('viewFlatBtn').classList.toggle('active', state.view==='flat');

  const teamViewEl = document.getElementById('teamView');
  const flatViewEl = document.getElementById('flatView');
  if(state.view==='team'){
    teamViewEl.style.display='grid';
    flatViewEl.style.display='none';
    renderTeamView();
  } else {
    teamViewEl.style.display='none';
    flatViewEl.style.display='block';
    renderFlatView();
  }
}

renderStats();
renderChips();
renderView();
</script>
</body>
</html>
