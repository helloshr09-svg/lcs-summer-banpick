<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 LCS SUMMER 협곡대회 — 밴픽 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e16;
    --bg-2:#0d1220;
    --panel:#131a28;
    --panel-2:#1b2436;
    --line: rgba(200,170,110,0.22);
    --gold:#c8aa6e;
    --gold-bright:#f0c766;
    --parchment:#f5ecd9;
    --muted:#aab4c8;
    --void:#8b5cf6;
    --piltover:#e8a93b;
    --zaun:#3ecf6e;
    --blue-side:#4c8bf5;
    --red-side:#e0554f;
    --danger:#e0554f;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, rgba(200,170,110,0.07), transparent 60%),
      var(--bg);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  header.top{
    padding:28px 24px 18px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(200,170,110,0.06), transparent);
    position:relative;
  }
  .home-fab{
    position:absolute; top:18px; right:20px;
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; border-radius:20px;
    border:1px solid var(--line); background:var(--panel);
    color:var(--muted); font-size:12.5px; font-weight:600;
    cursor:pointer; transition:all .15s ease;
  }
  .home-fab:hover{ border-color:var(--gold); color:var(--gold-bright); }
  @media (max-width:640px){
    .home-fab{ position:static; margin:14px auto 0; }
  }
  header.top h1{
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    letter-spacing:2px;
    font-size:26px;
    margin:0 0 6px;
    color:var(--gold-bright);
    text-shadow:0 0 18px rgba(240,199,102,0.35);
  }
  header.top p{
    margin:0;
    color:var(--muted);
    font-size:13px;
    letter-spacing:0.5px;
  }
  .legend{
    display:flex; gap:14px; justify-content:center; margin-top:12px; flex-wrap:wrap;
  }
  .legend span{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; color:var(--muted); font-family:'JetBrains Mono',monospace;
  }
  .dot{width:9px;height:9px;border-radius:2px;transform:rotate(45deg);display:inline-block;}
  main{max-width:1180px; margin:0 auto; padding:24px;}

  /* ---- Setup ---- */
  .group-tabs{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .group-tab{
    padding:9px 18px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel); color:var(--parchment); opacity:0.7; font-weight:700; font-size:13.5px;
    cursor:pointer; transition:all .15s ease;
  }
  .group-tab.active{color:#0a0e16; opacity:1;}
  .group-tab:hover{opacity:1; border-color:var(--gold);}
  .group-tab[data-g="공허"].active{background:var(--void); color:#fff;}
  .group-tab[data-g="필트오버"].active{background:var(--piltover);}
  .group-tab[data-g="자운"].active{background:var(--zaun); color:#08160e;}
  .format-btn.active{background:var(--gold-bright); color:#1a1410;}
  .series-format{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .series-status{
    text-align:center; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--gold-bright);
    margin-bottom:10px; letter-spacing:0.4px;
  }
  .fearless-list{
    text-align:center; font-size:11.5px; color:var(--muted); margin-bottom:14px;
  }
  .game-result-row{
    display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; margin:14px 0;
    padding:14px; border:1px solid var(--gold); border-radius:var(--radius); background:rgba(201,162,39,0.08);
  }

  .team-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;
  }
  .team-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 44px; cursor:pointer; transition:transform .12s ease, border-color .12s ease;
    position:relative;
  }
  .team-card:hover{transform:translateY(-2px); border-color:var(--gold);}
  .team-card .cap{font-weight:700; font-size:16px; margin-bottom:8px; padding-right:70px;}
  .team-card .members{font-size:13px; color:var(--parchment); opacity:0.85; line-height:1.85; font-family:'JetBrains Mono',monospace;}
  .team-card .pick-tag{
    position:absolute; top:10px; right:10px; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:6px; display:none;
  }
  .team-card.is-a{border-color:var(--blue-side); box-shadow:0 0 0 1px var(--blue-side) inset;}
  .team-card.is-a .pick-tag{display:inline-block; background:var(--blue-side); color:#fff;}
  .team-card.is-b{border-color:var(--red-side); box-shadow:0 0 0 1px var(--red-side) inset;}
  .team-card.is-b .pick-tag{display:inline-block; background:var(--red-side); color:#fff;}
  .edit-btn{
    position:absolute; bottom:10px; right:10px; font-size:10.5px;
    background:rgba(200,170,110,0.14); color:var(--gold-bright); border:1px solid var(--line);
    border-radius:6px; padding:4px 8px; cursor:pointer;
  }
  .edit-btn:hover{border-color:var(--gold); background:rgba(200,170,110,0.25);}

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(5,7,12,0.72);
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-box{
    background:var(--bg); border:1px solid var(--gold); border-radius:12px; padding:20px;
    max-width:520px; width:100%; max-height:82vh; overflow-y:auto; position:relative;
  }
  .modal-close{
    position:absolute; top:14px; right:14px; background:transparent; border:1px solid var(--line);
    color:var(--muted); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px;
  }
  .modal-close:hover{color:var(--gold-bright); border-color:var(--gold);}

  .selection-bar{
    margin-top:20px; padding:16px; background:var(--panel-2); border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap;
    border:1px solid var(--line);
  }
  .selection-bar .side{font-weight:700; font-size:15px;}
  .selection-bar .side.a{color:var(--blue-side);}
  .selection-bar .side.b{color:var(--red-side);}
  .vs{color:var(--gold); font-family:'Orbitron',sans-serif; font-weight:700;}
  button.primary{
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#1a1406; border:none; font-weight:700; padding:10px 22px; border-radius:8px;
    cursor:pointer; font-size:14px; letter-spacing:0.3px;
  }
  button.primary:disabled{opacity:0.35; cursor:not-allowed;}
  button.ghost{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  button.ghost:hover{border-color:var(--gold); color:var(--gold-bright);}

  /* ---- Roster edit ---- */
  .roster-edit{margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:820px){.roster-edit{grid-template-columns:1fr;}}
  .roster-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .roster-card h3{margin:0 0 12px; font-family:'Orbitron',sans-serif; font-size:15px;}
  .player-row{display:grid; grid-template-columns:56px 1fr; gap:12px; padding:14px 0; border-top:1px solid var(--line);}
  .player-row:first-of-type{border-top:none; padding-top:4px;}
  .role-badge{
    font-size:12px; font-weight:700; color:var(--gold-bright); align-self:flex-start;
    background:rgba(200,170,110,0.14); border-radius:6px; padding:6px 0; text-align:center; height:fit-content;
  }
  .player-name{font-size:14.5px; font-weight:700; margin-bottom:8px; font-family:'JetBrains Mono',monospace; color:var(--parchment);}
  .field-label{
    display:block; font-size:10.5px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.5px; margin-bottom:3px;
  }
  .field-group{display:flex; flex-direction:column; min-width:0;}
  .player-fields{display:grid; grid-template-columns:1fr 1fr; gap:10px 10px;}
  .player-fields .fg-champ, .player-fields .fg-notes{grid-column:1 / -1;}
  .player-fields input, .player-fields select{
    background:var(--bg-2); border:1px solid var(--line); color:var(--parchment);
    border-radius:6px; padding:8px 10px; font-size:13.5px; font-family:'Inter',sans-serif; width:100%;
  }
  .player-fields input:focus, .player-fields select:focus{
    outline:none; border-color:var(--gold); background:#111a2c;
  }
  .player-fields select{appearance:auto;}

  .start-row{text-align:center; margin-top:18px;}

  /* ---- Hex timeline ---- */
  #draftboard{display:none; margin-top:26px;}
  .hex-track{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
  .hex{
    width:38px; height:34px;
    background:var(--panel-2);
    clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:var(--parchment); opacity:0.75; font-family:'JetBrains Mono',monospace;
    border:1px solid var(--line); position:relative;
  }
  .hex.ban{width:30px; height:27px; font-size:14px;}
  .hex.blue{background:rgba(76,139,245,0.22); border-color:var(--blue-side); color:var(--blue-side); opacity:1;}
  .hex.red{background:rgba(224,85,79,0.22); border-color:var(--red-side); color:var(--red-side); opacity:1;}
  .hex.filled.blue{background:var(--blue-side); color:#fff; opacity:1;}
  .hex.filled.red{background:var(--red-side); color:#fff; opacity:1;}
  .hex.current{outline:3px solid var(--gold-bright); outline-offset:2px; animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{outline-color:var(--gold-bright);}50%{outline-color:transparent;}}

  .board-main{display:grid; grid-template-columns:250px 1fr 250px; gap:16px;}
  @media (max-width:900px){.board-main{grid-template-columns:1fr;}}
  .team-panel{background:var(--panel); border-radius:var(--radius); padding:14px; border:1px solid var(--line);}
  .team-panel h4{margin:0 0 4px; font-family:'Orbitron',sans-serif; font-size:14px;}
  .team-panel.blue h4{color:var(--blue-side);}
  .team-panel.red h4{color:var(--red-side);}
  .team-panel .sub{font-size:12px; color:var(--muted); margin-bottom:12px;}
  .slot-list{display:flex; flex-direction:column; gap:7px; margin-bottom:14px;}
  .slot{
    display:flex; align-items:center; gap:8px; font-size:13px;
    background:var(--bg-2); border-radius:6px; padding:8px 10px; min-height:18px;
    border:1px solid var(--line);
  }
  .slot .r{font-weight:700; color:var(--gold-bright); width:34px; flex-shrink:0; font-size:11.5px;}
  .slot .who{color:var(--parchment); opacity:0.8; font-family:'JetBrains Mono',monospace; font-size:11.5px; flex-shrink:0;}
  .slot .champ{font-weight:700; color:var(--parchment);}
  .ban-strip{display:flex; gap:6px; flex-wrap:wrap;}
  .ban-chip{
    font-size:12px; padding:5px 9px; border-radius:5px; background:rgba(224,85,79,0.18);
    color:#ff8f89; text-decoration:line-through; border:1px solid rgba(224,85,79,0.35); font-weight:600;
  }
  .ref-hint{margin-top:12px; font-size:12px; color:var(--parchment); opacity:0.75; line-height:1.6; border-top:1px solid var(--line); padding-top:10px;}

  .picker{background:var(--panel); border-radius:var(--radius); border:1px solid var(--line); padding:14px; display:flex; flex-direction:column;}
  .picker-status{
    text-align:center; font-family:'Orbitron',sans-serif; font-size:15px; margin-bottom:10px; color:var(--gold-bright);
  }
  .picker input.search{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-2); color:var(--parchment); margin-bottom:10px; font-size:14px;
  }
  .champ-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:7px;
    max-height:360px; overflow-y:auto; padding-right:4px;
  }
  .champ-chip{
    padding:9px 6px; text-align:center; font-size:12.5px; font-weight:600; border-radius:6px;
    background:var(--bg-2); border:1px solid var(--line); cursor:pointer; user-select:none; color:var(--parchment);
  }
  .champ-chip:hover{border-color:var(--gold); color:var(--gold-bright); background:#1a2438;}
  .champ-chip.used{opacity:0.3; text-decoration:line-through; cursor:not-allowed; pointer-events:none;}
  .picker-actions{display:flex; justify-content:space-between; gap:8px; margin-top:12px;}

  /* ---- script panel ---- */
  .script-panel{
    margin-top:26px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;
  }
  .script-panel h4{margin:0 0 4px; font-family:'Orbitron',sans-serif; font-size:14px; color:var(--gold-bright);}
  .script-panel .sub{font-size:11px; color:var(--muted); margin-bottom:10px;}
  .script-panel textarea{
    width:100%; min-height:120px; background:var(--bg-2); color:var(--parchment);
    border:1px solid var(--line); border-radius:8px; padding:10px; font-size:13px; font-family:'Inter',sans-serif;
    resize:vertical;
  }
  .save-note{font-size:11px; color:var(--muted); margin-top:6px; height:14px;}
  footer{text-align:center; color:var(--muted); font-size:11px; padding:30px 0 14px;}
</style>
</head>
<body>

<header class="top">
  <button class="home-fab" id="homeBtn">🏠 처음으로</button>
  <h1>2026 LCS SUMMER 협곡대회</h1>
  <p>밴픽 도우미 — 팀을 고르고 실시간으로 밴/픽을 진행하세요</p>
  <div class="legend">
    <span><i class="dot" style="background:var(--void)"></i>공허 그룹</span>
    <span><i class="dot" style="background:var(--piltover)"></i>필트오버 그룹</span>
    <span><i class="dot" style="background:var(--zaun)"></i>자운 그룹</span>
  </div>
</header>

<main>
  <section id="setup">
    <div class="group-tabs" id="groupTabs"></div>
    <div class="team-grid" id="teamGrid"></div>
    <div class="selection-bar">
      <span class="side a" id="labelA">Team A: 미선택</span>
      <span class="vs">VS</span>
      <span class="side b" id="labelB">Team B: 미선택</span>
      <button class="primary" id="goRosterBtn" disabled>선수 정보 확인 →</button>
    </div>
  </section>

  <section class="roster-edit" id="rosterEdit" style="display:none;"></section>
  <div class="start-row" id="startRow" style="display:none;">
    <div class="series-format" id="seriesFormatRow">
      <span style="font-size:13px; color:var(--muted); margin-right:4px;">경기 방식:</span>
      <button class="group-tab format-btn" data-fmt="bo1">BO1</button>
      <button class="group-tab format-btn" data-fmt="bo3">BO3</button>
      <button class="group-tab format-btn" data-fmt="bo5">BO5</button>
    </div>
    <div class="series-format" id="sideChoiceRow"></div>
    <button class="ghost" id="backBtn">← 팀 다시 선택</button>
    <button class="primary" id="startDraftBtn">밴픽 시작</button>
  </div>

  <section id="draftboard">
    <div class="series-status" id="seriesStatus" style="display:none;"></div>
    <div class="fearless-list" id="fearlessList" style="display:none;"></div>
    <div class="hex-track" id="hexTrack"></div>
    <div class="board-main">
      <div class="team-panel blue" id="panelA"></div>
      <div class="picker">
        <div class="picker-status" id="pickerStatus">-</div>
        <div class="game-result-row" id="gameResultRow" style="display:none;"></div>
        <input class="search" id="champSearch" placeholder="챔피언 검색... (목록에 없으면 직접 입력 후 Enter)">
        <div class="champ-grid" id="champGrid"></div>
        <div class="picker-actions">
          <button class="ghost" id="undoBtn">↩ 되돌리기</button>
          <button class="ghost" id="resetBtn">⟲ 초기화</button>
        </div>
      </div>
      <div class="team-panel red" id="panelB"></div>
    </div>
  </section>

  <div class="modal-overlay" id="teamEditModal">
    <div class="modal-box">
      <button class="modal-close" id="modalCloseBtn">✕ 닫기</button>
      <div id="modalRosterContent"></div>
    </div>
  </div>

  <div class="script-panel">
    <h4>📜 참고 스크립트</h4>
    <div class="sub">밴픽 전략 메모 — 이 브라우저에 자동 저장됩니다</div>
    <textarea id="scriptNotes" placeholder="예) 상대 미드가 라인전 강한 챔피언 위주면 초반 갱킹형 정글로 스노우볼...  &#10;공허 그룹 팀들은 대체로 한타 조합 선호, 자운 그룹은 스플릿 조합 多 ..."></textarea>
    <div class="save-note" id="saveNote"></div>
  </div>

  <footer>선수 전적/모스트픽 정보는 직접 입력 또는 조사 후 보정한 값입니다. 실제 최신 전적과 다를 수 있어요.</footer>
</main>

<script>
// ---------------- Data ----------------
const GROUP_COLOR = {공허:'var(--void)', 필트오버:'var(--piltover)', 자운:'var(--zaun)'};

const RAW_TEAMS = [
 // 공허 그룹
 {group:'공허', captain:'카사느님#KR1', members:['인생은이호준처럼#KR1','멋잼이#LCS','각도가생명#KR1','발빠른다람쥐의꿈#KR2']},
 {group:'공허', captain:'고토 야호#GTM', members:['N0CH4T#KR1','카타리나 고인#1234','코딩하러갑니다#KR1','버스가 체질#KR1']},
 {group:'공허', captain:'대학원생 원딜#KR1', members:['6 월#0624','와구카운터#아프지','도지이더리움#KR1','조약불#KR1']},
 {group:'공허', captain:'H2SO4#CCSS', members:['닌자 망치 곰 돌#KR1','ZIST#KR1','정택이꺼#KR1','늙고나약한김덕규#3030']},
 // 필트오버 그룹
 {group:'필트오버', captain:'BIBIBIBIBI#KR1', members:['동백꽃의 꽃말#KR1','heyesir38#KR2','쫑 쨉#KR1','ID옥미#KR2']},
 {group:'필트오버', captain:'힁 꿀#KR1', members:['동전교환기#KR1','동주견#KR1','정하권#KR1','드러눕습니다#사실아님']},
 {group:'필트오버', captain:'승 완 왕 자#KR1', members:['Nothing9#KR1','반의 반의 반도#KR1','호태장님#KR2','수면포기겜돌이#KR1']},
 {group:'필트오버', captain:'김펀치#GENG', members:['만번깍은피오라#KR2','머 효#KR1','종행교#1094','상 현#2000']},
 // 자운 그룹
 {group:'자운', captain:'T1 ggyumayusi#KR1', members:['문도킹#King','규 닥#KR1','르블갓#KR1','하 랑#KR2']},

// ---------------- Storage helpers ----------------
// window.storage(클로드 클라우드 저장소)를 우선 시도하고,
// 없거나 실패하면 이 브라우저의 localStorage로 자동 대체합니다.
const hasCloudStorage = (typeof window !== 'undefined') && !!window.storage;
async function storageGet(key){
  if(hasCloudStorage){
    try{
      const r = await window.storage.get(key);
      if(r) return r;
    }catch(e){ console.warn('클라우드 저장소 읽기 실패, localStorage로 대체:', e); }
  }
  const v = localStorage.getItem('lcs-banpick:'+key);
  return v ? {value:v} : null;
}
async function storageSet(key, value){
  localStorage.setItem('lcs-banpick:'+key, value); // 항상 로컬에도 백업 저장
  if(hasCloudStorage){
    try{ return await window.storage.set(key, value); }
    catch(e){ console.warn('클라우드 저장소 쓰기 실패, localStorage에만 저장됨:', e); }
  }
}

async function loadRosterEdits(){
  const res = await storageGet('roster-edits');
  if(res && res.value){
    try{
      const saved = JSON.parse(res.value);
      TEAMS.forEach(t=>{
        if(saved[t.id]){
          t.players.forEach((p,i)=>{
            const savedP = saved[t.id][i];
            if(savedP){
              // 저장된 값이 실제로 채워져 있을 때만 덮어쓴다 (빈 값으로 PREFILL을 지우지 않도록)
              ['champPool','tier','peakTier','notes'].forEach(key=>{
                if(savedP[key]){ p[key] = savedP[key]; }
              });
              if(savedP.sub){ p.sub = Object.assign({active:false,name:'',champPool:'',tier:'',peakTier:'',notes:''}, savedP.sub); }
            }
          });
        }
      });
    }catch(e){}
  }
}
async function saveRosterEdits(){
  const dump = {};
  TEAMS.forEach(t=>{ dump[t.id] = t.players.map(p=>({champPool:p.champPool, tier:p.tier, peakTier:p.peakTier, notes:p.notes, sub:p.sub})); });
  await storageSet('roster-edits', JSON.stringify(dump));
}

function renderTeamGrid(){
  const el = document.getElementById('teamGrid');
  const list = TEAMS.filter(t=> state.groupFilter==='전체' || t.group===state.groupFilter);
  el.innerHTML = list.map(t=>{
    const isOurs = t.id===OUR_TEAM_ID;
    const cls = isOurs ? 'is-a' : (t.id===state.teamBId ? 'is-b' : '');
    const tag = isOurs ? '우리팀' : (t.id===state.teamBId ? '상대' : '');
    return `<div class="team-card ${cls}" data-id="${t.id}" style="border-left:3px solid ${GROUP_COLOR[t.group]}">
      <div class="pick-tag" ${tag? '':'style="display:none;"'}>${tag}</div>

      <div class="cap">${t.name}</div>
      <div class="members">${t.players.map(p=>ROLE_LABEL[p.role]+' · '+displayName(p)+((p.sub&&p.sub.active)?' <span style="color:var(--gold-bright); font-size:10px;">(용병)</span>':'')).join('<br>')}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.team-card').forEach(card=>{
    card.onclick = (e)=>{
      if(e.target.closest('.edit-btn')) return;
      const id = card.dataset.id;
      if(id === OUR_TEAM_ID) return; // 우리 팀은 고정, 변경 불가
      if(state.teamBId===id){ state.teamBId=null; }
      else { state.teamBId=id; }
      renderTeamGrid(); renderSelectionBar();
    };
  });
  el.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); openTeamEditor(btn.dataset.id); };
  });

                <select class="sub-name">
                  <option value="">-- 용병으로 뛸 선수 선택 --</option>
                  ${TEAMS.map(ot=>`<optgroup label="${ot.group} · ${ot.name}">${ot.players.map(op=>`<option value="${op.name}" ${p.sub.name===op.name?'selected':''}>${ROLE_LABEL[op.role]} · ${op.name}</option>`).join('')}</optgroup>`).join('')}
                </select>
              </div>
              <div class="player-fields">
                <div class="field-group fg-champ">
                  <label class="field-label">용병 모스트 챔피언</label>
                  <input class="sub-champ-pool" placeholder="예: 아리, 조이, 코르키" value="${p.sub.champPool}">
                </div>
                <div class="field-group">
                  <label class="field-label">용병 현재 티어</label>
                  ${tierSelectHTML('선택 안함','sub-tier-now', p.sub.tier)}
                </div>
                <div class="field-group">
                  <label class="field-label">용병 최고 티어</label>
                  ${tierSelectHTML('선택 안함','sub-tier-peak', p.sub.peakTier)}
                </div>
                <div class="field-group fg-notes">
                  <label class="field-label">용병 메모</label>
                  <input class="sub-notes" placeholder="예: 카운터 챔프, 라인전 강함 등" value="${p.sub.notes}">
                </div>
              </div>
            </div>` : `
            <div class="player-fields">
              <div class="field-group fg-champ">
                <label class="field-label">모스트 챔피언</label>
                <input class="champ-pool" placeholder="예: 아리, 조이, 코르키" value="${p.champPool}">
              </div>
              <div class="field-group">
                <label class="field-label">현재 티어</label>
                ${tierSelectHTML('선택 안함','tier-now', p.tier)}
              </div>
              <div class="field-group">
                <label class="field-label">최고 티어</label>
                ${tierSelectHTML('선택 안함','tier-peak', p.peakTier)}
              </div>
              <div class="field-group fg-notes">
                <label class="field-label">메모</label>
                <input class="notes" placeholder="예: 라인전 강함, 캐리형 미드 선호, 특정 챔피언 카운터 등" value="${p.notes}">
              </div>
            </div>`}
          </div>
        </div>
      `;
      }).join('')}
    </div>
  `;
}

function attachRosterHandlers(container){
  container.querySelectorAll('.sub-toggle-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const t = TEAMS.find(x=>x.id===btn.dataset.team);
      const p = t.players[+btn.dataset.idx];
      p.sub.active = !p.sub.active;
      saveRosterEdits();
      renderTeamGrid();
      rerenderRosterUI(t.id);
    };
  });
  container.querySelectorAll('.player-row').forEach(row=>{
    const t = TEAMS.find(x=>x.id===row.dataset.team);
    const p = t.players[+row.dataset.idx];
    const champInput = row.querySelector('.champ-pool');
    const tierNowSelect = row.querySelector('.tier-now');
    const tierPeakSelect = row.querySelector('.tier-peak');
    const notesInput = row.querySelector('.notes');
    if(champInput) champInput.oninput = ()=>{ p.champPool = champInput.value; saveRosterEdits(); };
    if(tierNowSelect) tierNowSelect.onchange = ()=>{ p.tier = tierNowSelect.value; saveRosterEdits(); };
    if(tierPeakSelect) tierPeakSelect.onchange = ()=>{ p.peakTier = tierPeakSelect.value; saveRosterEdits(); };
    if(notesInput) notesInput.oninput = ()=>{ p.notes = notesInput.value; saveRosterEdits(); };

    const subNameInput = row.querySelector('.sub-name');
    const subChampInput = row.querySelector('.sub-champ-pool');
    const subTierNowSelect = row.querySelector('.sub-tier-now');
    const subTierPeakSelect = row.querySelector('.sub-tier-peak');
    const subNotesInput = row.querySelector('.sub-notes');
    if(subNameInput) subNameInput.onchange = ()=>{
      p.sub.name = subNameInput.value;
      const src = allPlayersFlat().find(x=>x.name===p.sub.name);
      if(src){
        p.sub.champPool = src.champPool;
        p.sub.tier = src.tier;
        p.sub.peakTier = src.peakTier;
      }
      saveRosterEdits();
      renderTeamGrid();
      rerenderRosterUI(t.id);
    };
    if(subChampInput) subChampInput.oninput = ()=>{ p.sub.champPool = subChampInput.value; saveRosterEdits(); };
    if(subTierNowSelect) subTierNowSelect.onchange = ()=>{ p.sub.tier = subTierNowSelect.value; saveRosterEdits(); };
    if(subTierPeakSelect) subTierPeakSelect.onchange = ()=>{ p.sub.peakTier = subTierPeakSelect.value; saveRosterEdits(); };
    if(subNotesInput) subNotesInput.oninput = ()=>{ p.sub.notes = subNotesInput.value; saveRosterEdits(); };
  });
}

function renderRosterEdit(){
  const el = document.getElementById('rosterEdit');
  const teams = [TEAMS.find(t=>t.id===state.teamAId), TEAMS.find(t=>t.id===state.teamBId)];
  el.innerHTML = teams.map(rosterCardHTML).join('');
  attachRosterHandlers(el);
}

// ---------------- 팀별 사전 정보 입력 모달 (매치업과 무관하게 언제든 편집) ----------------
function openTeamEditor(teamId){
  const t = TEAMS.find(x=>x.id===teamId);
  const modal = document.getElementById('teamEditModal');
  const content = document.getElementById('modalRosterContent');
  content.innerHTML = rosterCardHTML(t);
  attachRosterHandlers(content);
  modal.style.display = 'flex';
}
function closeTeamEditor(){
  document.getElementById('teamEditModal').style.display = 'none';
}

// ---------------- Draft board ----------------
document.getElementById('startDraftBtn').onclick = ()=>{
  // 1세트 블루/레드는 사용자가 직접 선택한 값을 사용 (랜덤 아님)
  if(state.firstGameBlueTeamId===state.teamAId){ state.blueTeamId = state.teamAId; state.redTeamId = state.teamBId; }
  else { state.blueTeamId = state.teamBId; state.redTeamId = state.teamAId; }
  state.step = 0; state.actions = [];
  state.gameNum = 1;
  state.seriesPicks = [];
  state.seriesScore = {[state.teamAId]:0, [state.teamBId]:0};
  document.getElementById('rosterEdit').style.display='none';
  document.getElementById('startRow').style.display='none';
  document.getElementById('draftboard').style.display='block';
  document.getElementById('gameResultRow').style.display='none';
  renderSeriesStatus(); renderHexTrack(); renderPanels(); renderPicker();
};

function teamOf(side){ return TEAMS.find(t=>t.id===(side==='blue'?state.blueTeamId:state.redTeamId)); }

function renderHexTrack(){
  const el = document.getElementById('hexTrack');
  el.innerHTML = DRAFT_ORDER.map((step,i)=>{
    const filled = i < state.step;
    const current = i === state.step;
    const label = step.phase==='ban' ? '✕' : (i+1);
    return `<div class="hex ${step.phase} ${step.side} ${filled?'filled':''} ${current?'current':''}">${label}</div>`;
  }).join('');
}

function renderPanels(){
  ['blue','red'].forEach(side=>{
    const t = teamOf(side);
    const panelId = (side==='blue') ? 'panelA' : 'panelB';
    const picks = state.actions.filter(a=>a.phase==='pick' && a.side===side);
    const bans = state.actions.filter(a=>a.phase==='ban' && a.side===side);
    const el = document.getElementById(panelId);
    el.className = 'team-panel ' + side;
    el.innerHTML = `
      <h4>${side==='blue'?'🔵':'🔴'} ${t.name}</h4>
      <div class="sub">${t.group} 그룹</div>
      <div class="slot-list">
        ${t.players.map(p=>{
          const picked = picks.find(a=>a.forPlayer===p.name);
          const dName = displayName(p);
          const subTag = (p.sub && p.sub.active) ? ' <span style="color:var(--gold-bright); font-size:10px;">(용병)</span>' : '';
          const cPool = effChampPool(p), cTier = effTier(p), cPeak = effPeakTier(p);
          return `<div class="slot">
            <div class="r">${ROLE_LABEL[p.role]}</div>
            <div>
              <div class="who">${dName}${subTag}</div>
              ${picked ? `<div class="champ">${picked.champ}</div>` : `<div style="color:var(--parchment); opacity:0.7; font-size:12px;">${cPool? '모스트: '+cPool : '미입력'}${cTier? ' · '+cTier+(cPeak? ' (최고 '+cPeak+')':'') : ''}</div>`}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div style="font-size:12px; color:var(--muted); font-weight:700; margin-bottom:6px;">밴 (${bans.length}/5)</div>
      <div class="ban-strip">${bans.map(b=>`<div class="ban-chip">${b.champ}</div>`).join('') || '<span style="color:var(--muted); font-size:12px;">-</span>'}</div>
      <div class="ref-hint">${t.players.filter(p=>effNotes(p)).map(p=>`<b style="color:var(--gold-bright)">${displayName(p)}</b>: ${effNotes(p)}`).join('<br>') || ''}</div>
    `;
  });
}

function currentUsedChamps(){
  return new Set([...state.actions.map(a=>a.champ), ...state.seriesPicks]);
}
function renderSeriesStatus(){
  const statusEl = document.getElementById('seriesStatus');
  const fearEl = document.getElementById('fearlessList');
  if(state.seriesFormat==='bo1'){
    statusEl.style.display='none';
    fearEl.style.display='none';
    return;
  }
  const a = TEAMS.find(t=>t.id===state.teamAId), b = TEAMS.find(t=>t.id===state.teamBId);
  const fmtLabel = state.seriesFormat==='bo5' ? 'BO5 피어리스 (본선)' : 'BO3 (예선/토너먼트)';
  const scoreA = state.seriesScore[state.teamAId]||0, scoreB = state.seriesScore[state.teamBId]||0;
  statusEl.style.display='block';
  statusEl.textContent = `${fmtLabel} · ${state.gameNum}세트 · ${a.name} ${scoreA} : ${scoreB} ${b.name}`;
  if(state.seriesPicks.length){
    fearEl.style.display='block';
    fearEl.textContent = '이전 세트 피어리스 사용 챔피언 (재사용 불가): ' + state.seriesPicks.join(', ');
  } else {
    fearEl.style.display='none';
  }
}

function renderPicker(){
  renderSeriesStatus();
  const statusEl = document.getElementById('pickerStatus');
  const gridEl = document.getElementById('champGrid');
  const searchEl = document.getElementById('champSearch');
  const resultRow = document.getElementById('gameResultRow');
  const isComplete = state.step >= DRAFT_ORDER.length;
  if(isComplete){
    statusEl.textContent = '✅ 밴픽 완료';
  } else {
    const step = DRAFT_ORDER[state.step];
    const t = teamOf(step.side);
    statusEl.textContent = `${step.side==='blue'?'🔵':'🔴'} ${t.name} — ${step.phase==='ban'?'밴':'픽'} (${state.step+1}/20)`;
  }
  if(isComplete && state.seriesFormat!=='bo1'){
    gridEl.style.display='none';
    searchEl.style.display='none';
    renderGameResultRow();
  } else {
    gridEl.style.display='';
    searchEl.style.display='';
    resultRow.style.display='none';
    const used = currentUsedChamps();
    const query = searchEl.value.trim().toLowerCase();
    const list = CHAMPIONS.filter(c=> c.toLowerCase().includes(query));
    gridEl.innerHTML = list.map(c=>`<div class="champ-chip ${used.has(c)?'used':''}" data-c="${c}">${c}</div>`).join('');
    gridEl.querySelectorAll('.champ-chip:not(.used)').forEach(chip=>{
      chip.onclick = ()=> commitAction(chip.dataset.c);
    });
  }
}

function renderGameResultRow(){
  const el = document.getElementById('gameResultRow');
  const a = TEAMS.find(t=>t.id===state.teamAId), b = TEAMS.find(t=>t.id===state.teamBId);
  const need = gamesToWin();
  el.style.display='flex';
  el.innerHTML = `
    <span style="font-weight:700;">${state.gameNum}세트 승자:</span>
    <button class="primary" id="winA">${a.name} 승</button>
    <button class="primary" id="winB">${b.name} 승</button>
  `;
  document.getElementById('winA').onclick = ()=> declareWinner(state.teamAId);
  document.getElementById('winB').onclick = ()=> declareWinner(state.teamBId);
}

function declareWinner(winnerTeamId){
  state.seriesScore[winnerTeamId] = (state.seriesScore[winnerTeamId]||0) + 1;
  const need = gamesToWin();
  const a = TEAMS.find(t=>t.id===state.teamAId), b = TEAMS.find(t=>t.id===state.teamBId);
  const scoreA = state.seriesScore[state.teamAId]||0, scoreB = state.seriesScore[state.teamBId]||0;
  if(scoreA>=need || scoreB>=need){
    const winner = scoreA>=need ? a : b;
    const el = document.getElementById('gameResultRow');
    el.innerHTML = `<span style="font-weight:700; color:var(--gold-bright);">🏆 시리즈 우승: ${winner.name} (${scoreA}:${scoreB})</span>`;
    return;
  }
  // 이번 게임에서 '픽'된 챔피언만 피어리스 목록에 누적 (밴은 다음 세트에 영향 없음)
  state.actions.filter(x=>x.phase==='pick').forEach(x=>{ if(!state.seriesPicks.includes(x.champ)) state.seriesPicks.push(x.champ); });
  const loserTeamId = (winnerTeamId===state.teamAId) ? state.teamBId : state.teamAId;
  renderSideChoiceRow(loserTeamId);
}

function renderSideChoiceRow(loserTeamId){
  const el = document.getElementById('gameResultRow');
  const loser = TEAMS.find(t=>t.id===loserTeamId);
  el.innerHTML = `
    <span style="font-weight:700;">${loser.name} (패배팀)이 ${state.gameNum+1}세트 진영을 선택하세요:</span>
    <button class="primary" id="pickBlue">🔵 블루 선택</button>
    <button class="primary" id="pickRed">🔴 레드 선택</button>
  `;
  document.getElementById('pickBlue').onclick = ()=> startNextGame(loserTeamId, 'blue');
  document.getElementById('pickRed').onclick = ()=> startNextGame(loserTeamId, 'red');
}

function startNextGame(loserTeamId, loserSide){
  const winnerTeamId = (loserTeamId===state.teamAId) ? state.teamBId : state.teamAId;
  if(loserSide==='blue'){ state.blueTeamId = loserTeamId; state.redTeamId = winnerTeamId; }
  else { state.redTeamId = loserTeamId; state.blueTeamId = winnerTeamId; }
  state.gameNum++;
  state.step = 0; state.actions = [];
  renderSeriesStatus(); renderHexTrack(); renderPanels(); renderPicker();
}

function commitAction(champName){
  if(state.step >= DRAFT_ORDER.length) return;
  if(currentUsedChamps().has(champName)) return;
  const step = DRAFT_ORDER[state.step];
  let forPlayer = null;
  if(step.phase==='pick'){
    const t = teamOf(step.side);
    const already = state.actions.filter(a=>a.phase==='pick' && a.side===step.side).length;
    forPlayer = t.players[already] ? t.players[already].name : null;
  }
  state.actions.push({champ:champName, phase:step.phase, side:step.side, forPlayer});
  state.step++;
  document.getElementById('champSearch').value='';
  renderHexTrack(); renderPanels(); renderPicker();
}

document.getElementById('champSearch').addEventListener('input', renderPicker);
document.getElementById('champSearch').addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){
    const val = e.target.value.trim();
    if(val) commitAction(val);
  }
});
document.getElementById('undoBtn').onclick = ()=>{
  if(state.actions.length===0) return;
  state.actions.pop(); state.step--;
  renderHexTrack(); renderPanels(); renderPicker();
};
document.getElementById('resetBtn').onclick = ()=>{
  state.step = 0; state.actions = [];
  renderHexTrack(); renderPanels(); renderPicker();
};
document.getElementById('homeBtn').onclick = ()=>{
  state.teamBId = null;
  state.blueTeamId = null;
  state.redTeamId = null;
  state.step = 0;
  state.actions = [];
  state.gameNum = 1;
  state.seriesPicks = [];
  state.seriesScore = {};
  state.firstGameBlueTeamId = null;
  document.getElementById('draftboard').style.display='none';
  document.getElementById('rosterEdit').style.display='none';
  document.getElementById('startRow').style.display='none';
  document.getElementById('setup').style.display='block';
  renderTeamGrid();
  renderSelectionBar();
};

// ---------------- Script notes autosave ----------------
let scriptSaveTimer;
document.getElementById('scriptNotes').addEventListener('input', ()=>{
  clearTimeout(scriptSaveTimer);
  scriptSaveTimer = setTimeout(saveScript, 800);
});

document.getElementById('modalCloseBtn').onclick = closeTeamEditor;
document.getElementById('teamEditModal').addEventListener('click', (e)=>{
  if(e.target.id === 'teamEditModal') closeTeamEditor();
});

// ---------------- Init ----------------
(async function init(){
  await loadRosterEdits();
  await loadScript();
  renderGroupTabs();
  renderTeamGrid();
  renderSelectionBar();
})();
</script>
</body>
</html>
